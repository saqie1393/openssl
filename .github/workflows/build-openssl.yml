name: Build OpenSSL Huawei ARM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            perl \
            rsync \
            wget \
            xz-utils

      - name: Download Linaro GCC 4.9.4
        run: |
          mkdir -p "$HOME/toolchains"

          wget -O /tmp/gcc.tar.xz \
            https://mirrors.dotsrc.org/armbian-dl/_toolchain/gcc-linaro-4.9.4-2017.01-x86_64_arm-linux-gnueabi.tar.xz

          tar -xf /tmp/gcc.tar.xz -C "$HOME/toolchains"

          echo "$HOME/toolchains/gcc-linaro-4.9.4-2017.01-x86_64_arm-linux-gnueabi/bin" >> "$GITHUB_PATH"

      - name: Verify compiler
        run: |
          which arm-linux-gnueabi-gcc
          arm-linux-gnueabi-gcc --version
          arm-linux-gnueabi-ld --version

      - name: Build VFP3 and NOVFP
        run: |
          chmod +x build.sh
          ./build.sh -j$(nproc)

      - name: Check output
        run: |
          echo "===== VFP3 ====="
          find installed/huawei/vfp3 -type f -print

          echo "===== NOVFP ====="
          find installed/huawei/novfp -type f -print

      - name: Check binaries
        run: |
          echo "===== VFP3 binaries ====="
          file installed/huawei/vfp3/bin/* || true

          echo "===== NOVFP binaries ====="
          file installed/huawei/novfp/bin/* || true

      - name: Package artifacts
        run: |
          tar -czf openssl-huawei-vfp3.tar.gz \
            -C installed/huawei vfp3

          tar -czf openssl-huawei-novfp.tar.gz \
            -C installed/huawei novfp

      - name: Upload VFP3
        uses: actions/upload-artifact@v4
        with:
          name: openssl-huawei-vfp3
          path: openssl-huawei-vfp3.tar.gz

      - name: Upload NOVFP
        uses: actions/upload-artifact@v4
        with:
          name: openssl-huawei-novfp
          path: openssl-huawei-novfp.tar.gz
